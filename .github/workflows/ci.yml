# Build, test (unit, architecture and integration tests with Testcontainers) and build the container images.
# Actions are pinned to a commit SHA (a tag can be moved); Dependabot keeps the pins up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PadelApi.slnx

      # Code style is part of the build (EnforceCodeStyleInBuild + TreatWarningsAsErrors).
      - name: Build
        run: dotnet build PadelApi.slnx --configuration Release --no-restore

      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Padel.Infrastructure --configuration Release --no-build

      # The integration tests start PostgreSQL and Keycloak containers (Docker is available on ubuntu-latest).
      - name: Test
        run: >
          dotnet test --solution PadelApi.slnx --configuration Release --no-build
          --report-trx --coverage --coverage-output-format cobertura --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

  container-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Builds the images into the local Docker daemon. Push them by adding a registry login and
      # -p:ContainerRegistry=<registry> once there is one to deploy from.
      - name: Build the API image
        run: dotnet publish src/Padel.Api/Padel.Api.csproj --configuration Release -t:PublishContainer -p:ContainerImageTags=${{ github.sha }}

      - name: Build the migration image
        run: dotnet publish src/Padel.MigrationService/Padel.MigrationService.csproj --configuration Release -t:PublishContainer -p:ContainerImageTags=${{ github.sha }}
